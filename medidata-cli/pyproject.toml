[project]
name = "medidata-cli"
version = "0.2.0"
description = "MediData Connect CLI — sync hospital local records into the MediData research network (full pipeline: login, connect, map-doctor, sync)"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "mysql-connector-python>=8.4.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "cryptography>=42.0.0",
    "keyring>=25.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
medidata = "medidata.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["medidata*"]
